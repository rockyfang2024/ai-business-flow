services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abf-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./llm_config.yaml:/app/llm_config.yaml
      - ../business-flow-skill:/business-flow-skill:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: abf-frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend