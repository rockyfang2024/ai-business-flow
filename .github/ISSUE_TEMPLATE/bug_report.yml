name: Bug Report

description: Create a report to help us improve

body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Description
        Describe the bug clearly.

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / Environment
      placeholder: Python 3.10, Node.js 18, OS: macOS
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Error Logs (if available)
      placeholder: |
        ```
        Paste error output here
        ```
    validations:
      required: false