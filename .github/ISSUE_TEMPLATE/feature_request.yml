name: Feature Request

description: Suggest an idea for this project

body:
  - type: markdown
    attributes:
      value: |
        ## 💡 Feature Description
        Describe the feature you'd like to add.

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why would this feature be valuable?
      placeholder: This feature would help because...
    validations:
      required: true

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: How would you use this feature?
      placeholder: |
        - As a user, I want to...
        - So that I can...
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other solutions you've considered?
    validations:
      required: false